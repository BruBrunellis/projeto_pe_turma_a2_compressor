name: Verificacoes basicas

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: basico-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  basico:
    name: Verificacoes basicas
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Conferir arquivos e compilar fontes C
        run: python3 scripts/check_basics.py